[pytest]
testpaths = automation/tests
pythonpath = automation
addopts = -v --tb=short
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
markers =
    f001: F001 Register Account (UC-01) automated tests
    tp_01_001: TP-01-001 valid registration flow (TC-01-001)
    tp_01_002: TP-01-002 invalid registration input rejected (TC-01-002)
    tp_01_003: TP-01-003 blank email rejected (TC-01-003)
    tp_01_004: TP-01-004 invalid password rejected (TC-01-004)
    f012: F012 Set Target (UC-12) automated tests
    tp_12_001: TP-12-001 valid daily targets (TC-12-001)
    tp_12_002: TP-12-002 invalid input rejected (TC-12-002)
    tp_12_003: TP-12-003 unauthenticated access denied (TC-12-003)
    f018: F018 View Cardio vs Workout (UC-18) automated tests
    tp_18_001: TP-18-001 cardio daily default (TC-18-001)
    tp_18_002: TP-18-002 cardio weekly (TC-18-002)
    tp_18_003: TP-18-003 workout daily (TC-18-003)
    tp_18_004: TP-18-004 workout weekly (TC-18-004)
    tp_18_005: TP-18-005 previous period navigation (TC-18-005)
    tp_18_006: TP-18-006 empty chart zero activities (TC-18-006)
    tp_18_007: TP-18-007 unauthenticated access denied (TC-18-007)
